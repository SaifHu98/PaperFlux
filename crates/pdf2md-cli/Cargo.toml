[package]
name = "pdf2md-cli"
version = "1.0.0"
edition = "2021"
authors = ["EcoUni Systems <dev@ecouni.org>"]
license = "MIT OR Apache-2.0"
description = "High-performance CLI tool for converting PDF documents into clean Markdown"

[[bin]]
name = "pdf2md"
path = "src/main.rs"

[dependencies]
pdf2md-core = { path = "../pdf2md-core" }
pdf2md-ast = { path = "../pdf2md-ast" }
pdf2md-ocr = { path = "../pdf2md-ocr" }
pdf2md-eval = { path = "../pdf2md-eval" }
clap = { workspace = true }
serde_json = { workspace = true }
