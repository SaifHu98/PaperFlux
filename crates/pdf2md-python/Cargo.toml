[package]
name = "pdf2md-python"
version = "0.1.0"
edition = "2021"
authors = ["EcoUni Systems <dev@ecouni.org>"]
license = "MIT OR Apache-2.0"
description = "Python FFI bindings for PaperFlux PDF Intelligence Engine"

[lib]
name = "paperflux"
crate-type = ["cdylib", "rlib"]

[dependencies]
pdf2md-core = { path = "../pdf2md-core" }
pdf2md-markdown = { path = "../pdf2md-markdown" }
pdf2md-ast = { path = "../pdf2md-ast" }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
serde_json = { workspace = true }
