[package]
name = "pdf2md-wasm"
version = "0.1.0"
edition = "2021"
authors = ["EcoUni Systems <dev@ecouni.org>"]
license = "MIT OR Apache-2.0"
description = "WebAssembly bindings for running pdf2md directly inside browser Web Workers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pdf2md-core = { path = "../pdf2md-core" }
pdf2md-ast = { path = "../pdf2md-ast" }
pdf2md-pdf = { path = "../pdf2md-pdf" }
pdf2md-layout = { path = "../pdf2md-layout" }
pdf2md-markdown = { path = "../pdf2md-markdown" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = { workspace = true }
